        quote: >
          A scientific project focused on seismic safety in Kazakhstan and Kyrgyzstan, utilizing earthquake sensors.
        description: |
          I participated in a scientific research project that implemented earthquake sensors based on <mark>GlobalQuake</mark> and <mark>RaspberryShake</mark>. My responsibilities included maintaining these sensors on <mark>Linux Raspberry Pi</mark> and leveraging technologies such as <mark>Raspberry Pi</mark>, <mark>Linux ARM</mark>, and <mark>Python</mark> with <mark>Miniconda</mark> for SLA/STA calculation. The project also utilized <mark>InfluxDB</mark> to monitor and manage data from all stations in real-time. Additionally, I configured <mark>GitHub CI</mark> to deploy <mark>Golang</mark> applications to servers that were provisioned and managed with <mark>Ansible</mark>.
