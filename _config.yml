        description: |
          The client chose a minimal architecture based on OnPremise virtual machines and a monolithic setup split between <mark>Nuxt</mark> and <mark>Laravel</mark> for the backend/admin panel. The tasks included deploying virtual machines on <mark>Ubuntu 22.04</mark>, configuring <mark>PostgreSQL</mark> with backups on a separate disk, setting up <mark>Redis</mark>, <mark>WebSockets</mark>, and configuring notifications via <mark>Nginx</mark> for Laravel. The project also involved setting up <mark>GitLab CI/CD</mark> pipelines using <mark>Deployer</mark> and <mark>PM2</mark> to reduce overhead from Docker Engine on the host system. Additional responsibilities involved installing <mark>Kaspersky antivirus</mark> for OS security, setting up a proxy server for traffic filtering, and ensuring communication with the Ops team.
