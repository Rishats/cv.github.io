        description: |
          The project utilized microservices built with <mark>PHP (Laravel)</mark>, <mark>Nuxt</mark>, and <mark>Webview</mark>, deployed on <mark>K8S</mark> using manifests. The primary objective was to assist in designing infrastructure for the DevOps team of the bank, based on their OnPremise <mark>RancherOS</mark>. The technology stack included <mark>RabbitMQ</mark>, <mark>Redis</mark>, <mark>Nginx</mark> as Load Balancer and Proxy, <mark>Nginx ingress</mark> in K8S based on RancherOS, and Dockerfiles. Additional responsibilities involved tuning <mark>PHP opcache</mark> for high load scenarios and conducting <mark>load testing</mark>.
