      - layout: top-middle
        title: Seismic Safety Startup
        link: https://stationview.raspberryshake.org/#/?lat=42.81982&lon=75.28019&zoom=8.000&sta=R1B7B
        link_text: Project Website
        additional_links:
          # - title: sproogen/modern-resume-theme
